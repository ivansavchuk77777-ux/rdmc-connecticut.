name: Verify RDMC one-time registration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/registration-review.yml']
permissions:
  contents: read
jobs:
  registration:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ef0de7fb35ba230eea485212f54480b38dd7121
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @capacitor/cli@^7 @capacitor/ios@^7
      - run: npm run build:ios && npx cap add ios && npx cap sync ios
      - name: Capture the one-time registration purchase for Apple Review
        run: |
          node scripts/prepare-ios-icon.mjs
          ruby ios-review/configure-tests.rb
          mkdir -p screenshots
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if runtime.endswith("SimRuntime.iOS-18-5") for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test -workspace ios/App/App.xcworkspace -scheme RegistrationReview \
            -destination "platform=iOS Simulator,id=$udid" -parallel-testing-enabled NO -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath /tmp/registration.xcresult CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments --path /tmp/registration.xcresult --output-path /tmp/registration-attachments
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('/tmp/registration-attachments')
          items = json.loads((root / 'manifest.json').read_text())
          shot, = [att for case in items for att in case['attachments'] if att['suggestedHumanReadableName'].startswith('RDMC-Registration-Review')]
          shutil.copyfile(root / shot['exportedFileName'], 'screenshots/Registration.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rdmc-registration-review
          path: screenshots/Registration.png
          if-no-files-found: error
