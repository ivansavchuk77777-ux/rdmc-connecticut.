name: Sync Printful merchandise
on:
  push:
    paths:
      - '.github/workflows/printful-sync.yml'
      - 'scripts/sync_printful.py'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: printful-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import published products
        env:
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
        run: python3 scripts/sync_printful.py
      - name: Save catalog
        run: |
          git config user.name "RDMC catalog sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Synchronize Printful merchandise"
          git push
