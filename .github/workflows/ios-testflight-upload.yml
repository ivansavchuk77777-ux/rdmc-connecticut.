name: RDMC upload existing IPA to TestFlight

on:
  workflow_run:
    workflows: ["RDMC signed iOS release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful signed iOS release GitHub Actions run ID"
        required: true
        default: "41867019061"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rdmc-testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Upload signed RDMC IPA to App Store Connect
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check upload authorization
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ASC_API_KEY_ID" || -z "$ASC_API_ISSUER_ID" || -z "$ASC_API_KEY_BASE64" ]]; then
            echo "::error::Missing App Store Connect credentials. Add ASC_API_KEY_ID, ASC_API_ISSUER_ID, and ASC_API_KEY_BASE64 in repository Actions secrets. Do not commit keys."
            exit 1
          fi
          [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]+$ ]] || { echo "::error::Invalid App Store Connect API key ID format"; exit 1; }
      - name: Download existing signed IPA from release run
        uses: actions/download-artifact@v4
        with:
          name: RDMC-signed-iPhone-release
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rdmc-upload
      - name: Upload IPA securely
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          IPA="$(find "$RUNNER_TEMP/rdmc-upload" -type f -name '*.ipa' -print -quit)"
          [[ -n "$IPA" && -s "$IPA" ]] || { echo "::error::No IPA found in chosen run"; exit 1; }
          # Verify the signed archive belongs to the registered existing RDMC app.
          IPA="$IPA" python3 - <<'PY'
          import os, plistlib, zipfile, sys
          with zipfile.ZipFile(os.environ["IPA"]) as archive:
              infos = [p for p in archive.namelist() if p.startswith("Payload/") and p.endswith(".app/Info.plist") and p.count("/") == 2]
              if len(infos) != 1:
                  sys.exit("Expected exactly one iOS application Info.plist in the signed IPA")
              data = plistlib.loads(archive.read(infos[0]))
              identifier = data.get("CFBundleIdentifier")
              if identifier != "us.rdmcfairfieldcounty.live":
                  sys.exit("Unexpected IPA bundle identifier; refusing upload")
              version = int(data.get("CFBundleVersion", "0"))
              if version <= 5:
                  sys.exit(f"Build {version} is not newer than Apple Build 5; refusing duplicate upload")
              print("Verified RDMC iPhone bundle identifier:", identifier, "build:", version)
          PY
          mkdir -p "$RUNNER_TEMP/asc-private-keys"
          KEY_FILE="$RUNNER_TEMP/asc-private-keys/AuthKey_${ASC_API_KEY_ID}.p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-private-keys"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Upload accepted by Apple's uploader. Check App Store Connect for processing and TestFlight availability."
