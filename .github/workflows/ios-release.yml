name: RDMC signed iOS release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdmc-ios-release
  cancel-in-progress: false

jobs:
  archive:
    name: Sign RDMC iPhone release
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-store-ios-preparation
      - name: Require existing signing credentials
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          test -n "$IOS_DISTRIBUTION_P12_BASE64"
          test -n "$IOS_DISTRIBUTION_P12_PASSWORD"
          test -n "$IOS_PROVISION_PROFILE_BASE64"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/ios@^7
      - run: node --test consumption.test.mjs
      - run: npm run build:ios
      - name: Preserve original devil artwork
        run: cmp IMG_1995.jpg dist/IMG_1995.jpg
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Install signing in temporary keychain
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/rdmc-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/rdmc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/rdmc.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import plistlib, datetime, os
          from pathlib import Path
          p = plistlib.loads(Path(os.environ["RUNNER_TEMP"], "profile.plist").read_bytes())
          assert p["Entitlements"]["application-identifier"] == "B852HHFN2S.us.rdmcfairfieldcounty.live"
          assert p["ExpirationDate"] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          assert not p.get("ProvisionedDevices") and not p.get("ProvisionsAllDevices")
          assert not p["Entitlements"].get("get-task-allow", False)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("RDMC_PROFILE_UUID=" + p["UUID"] + "\n")
          PY
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/rdmc.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Archive signed iPhone release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RDMC.xcarchive" \
            DEVELOPMENT_TEAM=B852HHFN2S \
            PRODUCT_BUNDLE_IDENTIFIER=us.rdmcfairfieldcounty.live \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$RDMC_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Export App Store IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          d = {"method": "app-store-connect", "teamID": "B852HHFN2S", "signingStyle": "manual",
               "signingCertificate": "Apple Distribution",
               "provisioningProfiles": {"us.rdmcfairfieldcounty.live": os.environ["RDMC_PROFILE_UUID"]}}
          Path(os.environ["RUNNER_TEMP"], "ExportOptions.plist").write_bytes(plistlib.dumps(d))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RDMC.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/rdmc-release"
          test -n "$(find "$RUNNER_TEMP/rdmc-release" -name '*.ipa' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: RDMC-signed-iPhone-release
          path: ${{ runner.temp }}/rdmc-release/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/rdmc-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/rdmc.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${RDMC_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$RDMC_PROFILE_UUID.mobileprovision"
          fi
