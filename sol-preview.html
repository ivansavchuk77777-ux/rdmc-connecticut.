<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#132a48,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:286px;height:286px;border-radius:50%;margin:24px auto 12px;display:grid;place-items:center;position:relative;background:#03101f;box-shadow:0 0 24px #0af,0 0 70px #087cff66;overflow:hidden;border:2px solid #39baff;animation:pulse 3s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #7dd9ff88;box-shadow:inset 0 0 24px #0af8;pointer-events:none;z-index:4}.solFace{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transform:scale(1.03);will-change:transform,filter;animation:alive 4s ease-in-out infinite}.orb.listening{box-shadow:0 0 44px #27a7ff,0 0 115px #087cffbb}.orb.listening .solFace{animation:listeningFace 1.5s ease-in-out infinite}.orb.speaking{box-shadow:0 0 52px #38c8ff,0 0 135px #087cffdd}.orb.speaking .solFace{animation:speakingFace .62s ease-in-out infinite}.solMouth{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;z-index:2;pointer-events:none;clip-path:inset(62.5% 35% 24% 35%);opacity:0;transform-origin:50% 68%;will-change:transform,filter}.orb.speaking .solMouth{opacity:1;animation:talkMouth .22s steps(2,end) infinite}.mouthGlow{position:absolute;left:50%;top:68%;width:64px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#6bd6ff88 0%,#249fff33 50%,transparent 75%);opacity:0;z-index:3;pointer-events:none}.orb.speaking .mouthGlow{animation:mouthPulse .19s ease-in-out infinite alternate}.wave{height:42px;display:flex;gap:5px;align-items:center;justify-content:center;margin:0 0 5px}.wave i{display:block;width:4px;height:8px;border-radius:4px;background:#20aaff;box-shadow:0 0 8px #20aaff;animation:quiet 1.1s ease-in-out infinite}.wave.speaking i{animation:voiceBars .32s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.05s}.wave i:nth-child(3){animation-delay:.10s}.wave i:nth-child(4){animation-delay:.15s}.wave i:nth-child(5){animation-delay:.10s}.wave i:nth-child(6){animation-delay:.05s}.wave i:nth-child(7){animation-delay:.13s}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:4px}h1{margin:4px 0 3px;font-size:31px}.subTitle{font-size:13px;color:#b9dfff;margin-bottom:8px}.voiceName{font-size:11px;color:#8fa4b8;min-height:16px;margin-bottom:10px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer;box-shadow:0 5px 18px #0008}.secondary{background:#15233a;border:1px solid #278cff}button:disabled{opacity:.42;cursor:not-allowed}.small{font-size:12px;color:#9ca9b8;margin-top:17px}.access{margin:10px 0 14px;padding:10px 12px;border-radius:12px;background:#0c1725;border:1px solid #1d4269;color:#a9c8e8;font-size:12px}.access.ok{border-color:#267d54;color:#9be4bc}.access.no{border-color:#77303a;color:#ffadb7}.back{display:inline-block;margin-top:14px;color:#79d3ff;text-decoration:none;font-size:13px}@keyframes pulse{50%{transform:scale(1.012)}}@keyframes alive{0%,100%{transform:scale(1.03) translateY(0)}50%{transform:scale(1.045) translateY(-2px)}}@keyframes listeningFace{0%,100%{transform:scale(1.045) translateX(-2px) rotate(-.45deg)}50%{transform:scale(1.06) translateX(2px) translateY(-2px) rotate(.45deg)}}@keyframes speakingFace{0%{transform:scale(1.04) translateY(1px) rotate(-.45deg)}50%{transform:scale(1.075) translateY(-4px) rotate(.45deg)}100%{transform:scale(1.045) translateY(1px) rotate(-.25deg)}}@keyframes talkMouth{0%{transform:scaleY(.88) translateY(1px)}25%{transform:scaleY(1.08) translateY(-1px)}50%{transform:scaleY(.94) translateY(1px)}75%{transform:scaleY(1.16) translateY(-2px)}100%{transform:scaleY(.9) translateY(1px)}}@keyframes mouthPulse{from{opacity:.10;transform:translate(-50%,-50%) scale(.76)}to{opacity:.58;transform:translate(-50%,-50%) scale(1.18)}}@keyframes quiet{50%{height:16px;opacity:.75}}@keyframes voiceBars{0%,100%{height:8px;opacity:.7}50%{height:34px;opacity:1}}@media (prefers-reduced-motion:reduce){.orb,.solFace,.solMouth,.mouthGlow,.wave i{animation:none!important}.orb.speaking .solFace{transform:scale(1.04)}.orb.speaking .solMouth{opacity:1;transform:scaleY(1.05)}}</style></head><body><main class="app"><div class="brand">RED DEVILS • BRIDGEPORT</div><div class="orb" id="orb"><img class="solFace" alt="Sol, RDMC assistant" src="./sol-avatar.jpg?v=2"><img class="solMouth" alt="" aria-hidden="true" src="./sol-avatar.jpg?v=2"><div class="mouthGlow" aria-hidden="true"></div></div><div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>Sol</h1><div class="subTitle">Your RDMC Assistant</div><div class="status" id="status">Checking member access…</div><div class="access" id="access">Sol is available to signed-in members with active dues.</div><div class="voiceName" id="voiceName"></div><div class="sub">Communication only. Sol cannot change RDMC settings, content, member access, or app features.</div><div class="controls"><button id="talk" disabled>🎙 Talk to Sol</button><button class="secondary" id="brothers" disabled>Greet the brothers</button><button class="secondary" id="prospects" disabled>Greet the prospects</button></div><a class="back" href="./">← Return to RDMC</a><div class="small">RDMC Sol assistant • Bridgeport</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xvejpoblnoxidshrykte.supabase.co','sb_publishable_0cVlRcxK1DwKtovHSWjE4Q_sMvv1xr2');const status=document.getElementById('status'),orb=document.getElementById('orb'),wave=document.getElementById('wave'),voiceName=document.getElementById('voiceName'),access=document.getElementById('access'),talk=document.getElementById('talk'),brothersBtn=document.getElementById('brothers'),prospectsBtn=document.getElementById('prospects');let allowed=false;const setMode=m=>{orb.classList.remove('listening','speaking');wave.classList.remove('speaking');if(m)orb.classList.add(m);if(m==='speaking')wave.classList.add('speaking')};const preferredUSFemale=/Jenny|Aria|Ava|Samantha|Zira/i;const fallbackUSFemale=/Allison|Susan|Victoria|Joanna|Kendra|Kimberly|Ivy|Ruth|Emma|Olivia|Sonia/i;const naturalNames=/Natural|Neural|Online|Enhanced/i;let selectedVoice=null;function chooseVoice(){const voices=speechSynthesis.getVoices();if(!voices.length){voiceName.textContent='Voice: loading device voices…';return null}const us=voices.filter(v=>(/^en-US$/i.test(v.lang)||/en-US|United States|US English/i.test(v.lang+' '+v.name))&&!/Australia|Australian|en-AU|Natasha/i.test(v.lang+' '+v.name));selectedVoice=us.find(v=>/Jenny/i.test(v.name)&&naturalNames.test(v.name))||us.find(v=>/Jenny/i.test(v.name))||us.find(v=>preferredUSFemale.test(v.name)&&naturalNames.test(v.name))||us.find(v=>preferredUSFemale.test(v.name))||us.find(v=>fallbackUSFemale.test(v.name)&&naturalNames.test(v.name))||us.find(v=>fallbackUSFemale.test(v.name))||us.find(v=>naturalNames.test(v.name))||us[0]||null;voiceName.textContent=selectedVoice?'Voice: '+selectedVoice.name+' • American English':'Voice: no U.S. female voice found on this device';return selectedVoice}function enableSol(name){allowed=true;talk.disabled=false;brothersBtn.disabled=false;prospectsBtn.disabled=false;status.textContent='Ready';access.className='access ok';access.textContent=(name?name+', ':'')+'your Sol communication access is active.';chooseVoice()}function denySol(message){allowed=false;talk.disabled=true;brothersBtn.disabled=true;prospectsBtn.disabled=true;status.textContent='Access required';access.className='access no';access.textContent=message;voiceName.textContent=''}async function checkAccess(){const{data:{user}}=await supabase.auth.getUser();if(!user){denySol('Sign in to the RDMC app first. Sol is available only to approved members with active dues.');return}const{data,error}=await supabase.from('profiles').select('full_name,subscription_status').eq('id',user.id).single();if(error||!data){denySol('Your RDMC member profile could not be verified.');return}if(!['active','exempt'].includes(data.subscription_status)){denySol('Your RDMC access is not active. Sol becomes available when your dues/access status is active.');return}enableSol(data.full_name)}await checkAccess();if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(allowed)chooseVoice()};const speak=t=>{if(!allowed)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=chooseVoice();if(v)u.voice=v;u.lang='en-US';u.rate=.98;u.pitch=1.08;u.volume=1;u.onstart=()=>{status.textContent='Sol is speaking…';setMode('speaking')};u.onend=()=>{status.textContent='Ready';setMode('')};u.onerror=()=>{status.textContent='Voice playback had a problem.';setMode('')};speechSynthesis.speak(u)};const brothers="Hey, brothers — welcome to RDMC! Tommy, Dave, Blaster, Smurg, Hook, Ivan... good to have you all here. I hope everybody's doing well tonight. Settle in, enjoy the meeting, and if you need anything, just ask. I'm right here with you. Have a good one, brothers. RDMC!";const prospects="Hey Jim, Sam, and Bill — welcome. Glad to have you here. I hope you're all doing well. Enjoy the meeting, and if you need anything, just ask. I'm here to help.";brothersBtn.onclick=()=>speak(brothers);prospectsBtn.onclick=()=>speak(prospects);talk.onclick=()=>{if(!allowed)return;status.textContent='Opening Sol in ChatGPT…';setMode('listening');window.location.href='https://chatgpt.com/?q='+encodeURIComponent('I am using the RDMC Bridgeport app. Be Sol, my RDMC assistant. This is communication-only access. Do not change RDMC app settings, website content, membership permissions, or app features. Start by greeting me and asking what I need.')};</script></body></html>
