<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#132a48,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:286px;height:286px;border-radius:50%;margin:24px auto 18px;display:grid;place-items:center;position:relative;background:#03101f;box-shadow:0 0 24px #0af,0 0 70px #087cff66;animation:orbPulse 3s ease-in-out infinite;overflow:hidden;border:2px solid #39baff}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #7dd9ff88;box-shadow:inset 0 0 24px #0af8;pointer-events:none}.solFace{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transform:scale(1.03);transition:transform .3s ease}.orb.listening{box-shadow:0 0 42px #27a7ff,0 0 110px #087cffaa}.orb.listening .solFace{transform:scale(1.06)}.orb.speaking{box-shadow:0 0 46px #2bbcff,0 0 120px #087cffaa}.orb.speaking .solFace{animation:speakFace .55s ease-in-out infinite}.wave{height:38px;display:flex;gap:4px;align-items:center;justify-content:center;margin:-2px 0 6px}.wave i{display:block;width:4px;height:9px;border-radius:4px;background:#20aaff;box-shadow:0 0 8px #20aaff;animation:quiet 1.2s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.25s}.wave i:nth-child(7){animation-delay:.15s}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:12px}h1{margin:4px 0 3px;font-size:31px}.subTitle{font-size:13px;color:#b9dfff;margin-bottom:8px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer;box-shadow:0 5px 18px #0008}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:17px}@keyframes orbPulse{50%{transform:scale(1.015)}}@keyframes speakFace{0%,100%{transform:scale(1.035) translateY(0)}50%{transform:scale(1.055) translateY(-2px)}}@keyframes quiet{50%{height:16px;opacity:.75}}</style></head><body><main class="app"><div class="brand">RED DEVILS • BRIDGEPORT</div><div class="orb" id="orb"><img class="solFace" alt="Sol, RDMC assistant" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDR
