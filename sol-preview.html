<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#132a48,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:286px;height:286px;border-radius:50%;margin:24px auto 18px;display:grid;place-items:center;position:relative;background:#03101f;box-shadow:0 0 24px #0af,0 0 70px #087cff66;overflow:hidden;border:2px solid #39baff;animation:pulse 3s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #7dd9ff88;box-shadow:inset 0 0 24px #0af8;pointer-events:none}.solFace{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transform:scale(1.03)}.orb.listening{box-shadow:0 0 42px #27a7ff,0 0 110px #087cffaa}.orb.listening .solFace{transform:scale(1.06)}.orb.speaking{box-shadow:0 0 46px #2bbcff,0 0 120px #087cffaa}.orb.speaking .solFace{animation:speak .55s ease-in-out infinite}.wave{height:38px;display:flex;gap:4px;align-items:center;justify-content:center;margin:-2px 0 6px}.wave i{display:block;width:4px;height:9px;border-radius:4px;background:#20aaff;box-shadow:0 0 8px #20aaff;animation:quiet 1.2s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.25s}.wave i:nth-child(7){animation-delay:.15s}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:12px}h1{margin:4px 0 3px;font-size:31px}.subTitle{font-size:13px;color:#b9dfff;margin-bottom:8px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:17px}@keyframes pulse{50%{transform:scale(1.015)}}@keyframes speak{0%,100%{transform:scale(1.035)}50%{transform:scale(1.055) translateY(-2px)}}@keyframes quiet{50%{height:16px;opacity:.75}}</style></head><body><main class="app"><div class="brand">RED DEVILS • BRIDGEPORT</div><div class="orb" id="orb"><img class="solFace" alt="Sol, RDMC assistant" src="./sol-avatar.jpg?v=2"><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><h1>Sol</h1><div class="subTitle">Your RDMC Assistant</div><div class="status" id="status">Ready</div><div class="sub">Tap a greeting, or open live ChatGPT voice.</div><div class="controls"><button id="talk">🎙 Talk to Sol</button><button class="secondary" id="brothers">Greet the brothers</button><button class="secondary" id="prospects">Greet the prospects</button></div><div class="small">RDMC Sol assistant • Bridgeport</div></main><script>const status=document.getElementById('status'),orb=document.getElementById('orb');const setMode=m=>{orb.classList.remove('listening','speaking');if(m)orb.classList.add(m)};const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.94;u.pitch=1.02;u.onstart=()=>{status.textContent='Sol is speaking…';setMode('speaking')};u.onend=()=>{status.textContent='Ready';setMode('')};u.onerror=()=>{status.textContent='Voice playback had a problem.';setMode('')};speechSynthesis.speak(u)};const brothers="Welcome, brothers, to RDMC! Welcome Tommy, welcome Dave, welcome Blaster, welcome Smurg, welcome Hook, and welcome Ivan. Great to have all the brothers here.";const prospects="Welcome Jim, welcome Sam, and welcome Bill. Great to have you here.";document.getElementById('brothers').onclick=()=>speak(brothers);document.getElementById('prospects').onclick=()=>speak(prospects);document.getElementById('talk').onclick=()=>{status.textContent='Opening Sol in ChatGPT…';setMode('listening');window.location.href='https://chatgpt.com/?q='+encodeURIComponent('I am using the RDMC Bridgeport app. Be Sol, my RDMC assistant. Start by greeting me and asking what I need.')};</script></body></html>
