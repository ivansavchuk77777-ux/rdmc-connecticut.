<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive Preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#17283f,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:270px;height:270px;border-radius:50%;margin:24px auto 18px;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#0c9cff30,#07111f 62%,#000);box-shadow:0 0 24px #0af,0 0 65px #087cff66;animation:orbPulse 3s ease-in-out infinite}.orb.listening{box-shadow:0 0 38px #27a7ff,0 0 100px #087cffaa}.orb.speaking{box-shadow:0 0 42px #ff243a,0 0 110px #087cff88}.halo{position:absolute;inset:14px;border:1px solid #42b9ff66;border-radius:50%;animation:halo 4s linear infinite}.face{width:174px;height:196px;position:relative;animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 80%}.horn{position:absolute;top:-28px;width:56px;height:76px;border:10px solid #b51322;border-bottom:0;border-radius:60% 60% 0 0;filter:drop-shadow(0 0 9px #ff203b99)}.horn.left{left:7px;transform:rotate(-26deg)}.horn.right{right:7px;transform:rotate(26deg)}.skin{position:absolute;inset:18px 12px 0;border-radius:48% 48% 45% 45%;background:linear-gradient(145deg,#7f1623 0%,#d12b39 42%,#72101c 100%);box-shadow:inset 0 0 28px #2e0208,0 0 20px #ff203b55}.brow{position:absolute;top:68px;width:48px;height:7px;background:#2a0208;border-radius:99px;z-index:5}.brow.left{left:30px;transform:rotate(-8deg)}.brow.right{right:30px;transform:rotate(8deg)}.eye{position:absolute;top:84px;width:42px;height:23px;border-radius:50%;background:#ecf8ff;overflow:hidden;z-index:6;box-shadow:0 0 8px #75d3ff}.eye.left{left:31px}.eye.right{right:31px}.lid{position:absolute;inset:0;background:#b82030;transform:translateY(-105%);z-index:8}.pupil{position:absolute;left:14px;top:6px;width:13px;height:13px;border-radius:50%;background:#07101b;box-shadow:0 0 8px #00aaff;transition:.18s}.orb.listening .pupil{box-shadow:0 0 12px 4px #38c6ff}.orb.listening .eye{box-shadow:0 0 14px #6fdcff}.nose{position:absolute;top:109px;left:50%;width:14px;height:26px;transform:translateX(-50%);border-left:3px solid #591019;border-bottom:3px solid #591019;border-radius:0 0 0 9px;z-index:6}.mouth{position:absolute;left:50%;top:145px;width:54px;height:10px;transform:translateX(-50%);border-radius:0 0 50% 50%;background:#280208;border:4px solid #5b0813;z-index:7;transition:.08s}.orb.speaking .mouth{height:28px;width:48px;border-radius:45%;background:#160104}.smile{position:absolute;left:50%;top:148px;width:58px;height:18px;transform:translateX(-50%);border-bottom:4px solid #f06a77;border-radius:0 0 50% 50%;z-index:8;opacity:.8}.orb.speaking .smile{opacity:.25}.cheek{position:absolute;top:119px;width:28px;height:14px;border-radius:50%;background:#ff6b7940;filter:blur(2px);z-index:4}.cheek.left{left:23px}.cheek.right{right:23px}.orb.listening .face{animation:listenTilt 1.8s ease-in-out infinite}.orb.speaking .face{animation:speakBob .65s ease-in-out infinite}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:12px}h1{margin:4px 0 6px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer;box-shadow:0 5px 18px #0008}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:17px}@keyframes orbPulse{50%{transform:scale(1.02)}}@keyframes halo{50%{transform:scale(1.04);opacity:.55}}@keyframes breathe{50%{transform:translateY(-3px) scale(1.015)}}@keyframes listenTilt{0%,100%{transform:rotate(-1.5deg) translateY(-2px)}50%{transform:rotate(1.5deg) translateY(1px)}}@keyframes speakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes blink{0%,45%,49%,100%{transform:translateY(-105%)}46%,48%{transform:translateY(0)}}.eye .lid{animation:blink 5s infinite}.eye.right .lid{animation-delay:.04s}</style></head><body><main class="app"><div class="brand">RED DEVILS • CONNECTICUT</div><div class="orb" id="orb"><div class="halo"></div><div class="face"><div class="horn left"></div><div class="horn right"></div><div class="skin"></div><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="pupil"></div><div class="lid"></div></div><div class="eye right"><div class="pupil"></div><div class="lid"></div></div><div class="nose"></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth" id="mouth"></div><div class="smile"></div></div></div><h1>Sol</h1><div class="status" id="status">Calm. Grounded. A little playful.</div><div class="sub">Tap Talk to Sol, or use one of the RDMC greetings.</div><div class="controls"><button id="talk">🎙 Talk to Sol</button><button class="secondary" id="brothers">Greet the brothers</button><button class="secondary" id="prospects">Greet the prospects</button></div><div class="small">RDMC Sol animated voice-interface preview</div></main><script>const status=document.getElementById('status'),orb=document.getElementById('orb'),mouth=document.getElementById('mouth');let mouthTimer=null;const setMode=m=>{orb.classList.remove('listening','speaking');if(m)orb.classList.add(m)};const animateMouth=on=>{clearInterval(mouthTimer);if(!on){mouth.style.height='10px';mouth.style.width='54px';return}mouthTimer=setInterval(()=>{const open=12+Math.round(Math.random()*22);mouth.style.height=open+'px';mouth.style.width=(44+Math.round(Math.random()*10))+'px'},95)};const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.94;u.pitch=1.02;u.onstart=()=>{status.textContent='Sol is speaking…';setMode('speaking');animateMouth(true)};u.onend=()=>{status.textContent='Tap Talk to Sol';setMode('');animateMouth(false)};u.onerror=()=>{status.textContent='Voice playback had a problem.';setMode('');animateMouth(false)};speechSynthesis.speak(u)};const brothers="Welcome, brothers, to RDMC! Welcome Tommy, welcome Dave, welcome Blaster, welcome Smurg, welcome Hook, and welcome Ivan. How are all my brothers feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting tonight. Enjoy the time together, brothers. And if there's anything I can help with during the meeting, just ask me. Sol is here for you. Have a great meeting, brothers. RDMC!";const prospects="Welcome Jim, welcome Sam, and welcome Bill. How are you all feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting. And if there's anything I can help with, just ask me. Sol is here for you.";document.getElementById('brothers').onclick=()=>speak(brothers);document.getElementById('prospects').onclick=()=>speak(prospects);document.getElementById('talk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Voice recognition is not supported in this browser.';return}const r=new SR();r.lang='en-US';r.onstart=()=>{status.textContent='Sol is listening…';setMode('listening')};r.onresult=e=>{const q=e.results[0][0].transcript.toLowerCase();status.textContent='You said: '+q;if(q.includes('greet')&&q.includes('prospect'))speak(prospects);else if(q.includes('greet'))speak(brothers);else speak('I heard you. I am Sol, your RDMC assistant preview. I am calm, grounded, and maybe just a little playful.')};r.onerror=()=>{status.textContent='I could not hear that. Try again.';setMode('')};r.onend=()=>{if(!speechSynthesis.speaking&&orb.classList.contains('listening'))setMode('')};r.start()};</script></body></html>
