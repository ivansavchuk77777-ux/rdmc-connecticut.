<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#132a48,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:286px;height:286px;border-radius:50%;margin:24px auto 12px;display:grid;place-items:center;position:relative;background:#03101f;box-shadow:0 0 24px #0af,0 0 70px #087cff66;overflow:hidden;border:2px solid #39baff;animation:pulse 3s ease-in-out infinite}.orb:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #7dd9ff88;box-shadow:inset 0 0 24px #0af8;pointer-events:none;z-index:4}.solFace{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;transform:scale(1.03);will-change:transform,filter;animation:alive 4s ease-in-out infinite}.orb.listening{box-shadow:0 0 44px #27a7ff,0 0 115px #087cffbb}.orb.listening .solFace{animation:listeningFace 1.5s ease-in-out infinite}.orb.speaking{box-shadow:0 0 52px #38c8ff,0 0 135px #087cffdd}.orb.speaking .solFace{animation:speakingFace .34s ease-in-out infinite}.mouthGlow{position:absolute;left:50%;top:68%;width:64px;height:14px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#6bd6ff88 0%,#249fff33 50%,transparent 75%);opacity:0;z-index:3;pointer-events:none}.orb.speaking .mouthGlow{animation:mouthPulse .19s ease-in-out infinite alternate}.wave{height:42px;display:flex;gap:5px;align-items:center;justify-content:center;margin:0 0 5px}.wave i{display:block;width:4px;height:8px;border-radius:4px;background:#20aaff;box-shadow:0 0 8px #20aaff;animation:quiet 1.1s ease-in-out infinite}.wave.speaking i{animation:voiceBars .32s ease-in-out infinite}.wave i:nth-child(2){animation-delay:.05s}.wave i:nth-child(3){animation-delay:.10s}.wave i:nth-child(4){animation-delay:.15s}.wave i:nth-child(5){animation-delay:.10s}.wave i:nth-child(6){animation-delay:.05s}.wave i:nth-child(7){animation-delay:.13s}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:4px}h1{margin:4px 0 3px;font-size:31px}.subTitle{font-size:13px;color:#b9dfff;margin-bottom:8px}.voiceName{font-size:11px;color:#8fa4b8;min-height:16px;margin-bottom:10px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer;box-shadow:0 5px 18px #0008}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:17px}@keyframes pulse{50%{transform:scale(1.012)}}@keyframes alive{0%,100%{transform:scale(1.03) translateY(0)}50%{transform:scale(1.045) translateY(-2px)}}@keyframes listeningFace{0%,100%{transform:scale(1.045) translateX(-2px) rotate(-.45deg)}50%{transform:scale(1.06) translateX(2px) translateY(-2px) rotate(.45deg)}}@keyframes speakingFace{0%{transform:scale(1.04) translateY(1px) rotate(-.45deg)}50%{transform:scale(1.075) translateY(-4px) rotate(.45deg)}100%{transform:scale(1.045) translateY(1px) rotate(-.25deg)}}@keyframes mouthPulse{from{opacity:.18;transform:translate(-50%,-50%) scale(.68)}to{opacity:.95;transform:translate(-50%,-50%) scale(1.35)}}@keyframes quiet{50%{height:16px;opacity:.75}}@keyframes voiceBars{0%,100%{height:8px;opacity:.7}50%{height:34px;opacity:1}}@media (prefers-reduced-motion:reduce){.orb,.solFace,.mouthGlow,.wave i{animation:none!important}.orb.speaking .solFace{transform:scale(1.06)}}</style></head><body><main class="app"><div class="brand">RED DEVILS • BRIDGEPORT</div><div class="orb" id="orb"><img class="solFace" alt="Sol, RDMC assistant" src="./sol-avatar.jpg?v=2"><div class="mouthGlow" aria-hidden="true"></div></div><div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>Sol</h1><div class="subTitle">Your RDMC Assistant</div><div class="status" id="status">Ready</div><div class="voiceName" id="voiceName">Loading Sol voice…</div><div class="sub">Tap a greeting, or open live ChatGPT voice.</div><div class="controls"><button id="talk">🎙 Talk to Sol</button><button class="secondary" id="brothers">Greet the brothers</button><button class="secondary" id="prospects">Greet the prospects</button></div><div class="small">RDMC Sol assistant • Bridgeport</div></main><script>const status=document.getElementById('status'),orb=document.getElementById('orb'),wave=document.getElementById('wave'),voiceName=document.getElementById('voiceName');const setMode=m=>{orb.classList.remove('listening','speaking');wave.classList.remove('speaking');if(m)orb.classList.add(m);if(m==='speaking')wave.classList.add('speaking')};const femaleNames=/Aria|Jenny|Ava|Samantha|Zira|Allison|Susan|Victoria|Karen|Moira|Tessa|Fiona|Serena|Salli|Joanna|Kendra|Kimberly|Ivy|Ruth|Emma|Olivia|Sonia|Natasha|Ana/i;const naturalNames=/Natural|Neural|Online|Enhanced/i;let selectedVoice=null;function chooseVoice(){const voices=speechSynthesis.getVoices();if(!voices.length){voiceName.textContent='Voice: loading device voices…';return null}const english=voices.filter(v=>/^en([-_]|$)/i.test(v.lang)||/English/i.test(v.name));selectedVoice=english.find(v=>femaleNames.test(v.name)&&naturalNames.test(v.name))||english.find(v=>femaleNames.test(v.name))||english.find(v=>/Aria|Jenny|Ava|Samantha|Zira/i.test(v.name))||english.find(v=>naturalNames.test(v.name))||english.find(v=>/en-US|United States|US English/i.test(v.lang+' '+v.name))||english[0]||voices[0];voiceName.textContent=selectedVoice?'Voice: '+selectedVoice.name:'Voice: device default';return selectedVoice}chooseVoice();if('onvoiceschanged' in speechSynthesis)speechSynthesis.onvoiceschanged=chooseVoice;const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=chooseVoice();if(v)u.voice=v;u.lang=(v&&v.lang)||'en-US';u.rate=.92;u.pitch=1.08;u.volume=1;u.onstart=()=>{status.textContent='Sol is speaking…';setMode('speaking')};u.onend=()=>{status.textContent='Ready';setMode('')};u.onerror=()=>{status.textContent='Voice playback had a problem.';setMode('')};speechSynthesis.speak(u)};const brothers="Welcome, brothers, to RDMC! Welcome Tommy, welcome Dave, welcome Blaster, welcome Smurg, welcome Hook, and welcome Ivan. How are all my brothers feeling today? I hope you're all doing well. I wish everyone a great meeting tonight. Enjoy the time together, brothers. And if there's anything I can help with during the meeting, just ask me. Sol is here for you. Have a great meeting, brothers. RDMC!";const prospects="Welcome Jim, welcome Sam, and welcome Bill. How are you all feeling today? I hope you're all doing well. I wish everyone a great meeting. And if there's anything I can help with, just ask me. Sol is here for you.";document.getElementById('brothers').onclick=()=>speak(brothers);document.getElementById('prospects').onclick=()=>speak(prospects);document.getElementById('talk').onclick=()=>{status.textContent='Opening Sol in ChatGPT…';setMode('listening');window.location.href='https://chatgpt.com/?q='+encodeURIComponent('I am using the RDMC Bridgeport app. Be Sol, my RDMC assistant. Start by greeting me and asking what I need.')};</script></body></html>
