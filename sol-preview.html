<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Preview</title><style>body{margin:0;background:radial-gradient(circle at 50% 25%,#16233a,#07090d 55%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(420px,92vw);text-align:center}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900}.orb{width:240px;height:240px;border-radius:50%;margin:28px auto;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#0c9cff33,#07111f 62%,#000);box-shadow:0 0 24px #0af,0 0 65px #087cff66;animation:pulse 2s infinite}.face{font-size:96px;filter:drop-shadow(0 0 12px #ff263c)}.horn{position:absolute;top:45px;font-size:55px;color:#a70e18}.horn.l{left:50px;transform:rotate(-25deg)}.horn.r{right:50px;transform:rotate(25deg)}@keyframes pulse{50%{box-shadow:0 0 38px #0af,0 0 90px #087cff99;transform:scale(1.02)}}h1{margin:8px 0}.status{color:#73cfff;min-height:24px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:18px}</style></head><body><main class="app"><div class="brand">RED DEVILS • CONNECTICUT</div><div class="orb"><span class="horn l">⌁</span><span class="face">😈</span><span class="horn r">⌁</span></div><h1>Sol</h1><div class="status" id="status">Tap Talk to Sol</div><div class="controls"><button id="talk">🎙 Talk to Sol</button><button class="secondary" id="brothers">Greet the brothers</button><button class="secondary" id="prospects">Greet the prospects</button></div><div class="small">RDMC Sol voice-interface preview</div></main><script>const status=document.getElementById('status');const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.onstart=()=>status.textContent='Sol is speaking…';u.onend=()=>status.textContent='Tap Talk to Sol';speechSynthesis.speak(u)};const brothers="Welcome, brothers, to RDMC! Welcome Tommy, welcome Dave, welcome Blaster, welcome Smurg, welcome Hook, and welcome Ivan. How are all my brothers feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting tonight. Enjoy the time together, brothers. And if there's anything I can help with during the meeting, just ask me. Sol is here for you. Have a great meeting, brothers. RDMC!";const prospects="Welcome Jim, welcome Sam, and welcome Bill. How are you all feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting. And if there's anything I can help with, just ask me. Sol is here for you.";document.getElementById('brothers').onclick=()=>speak(brothers);document.getElementById('prospects').onclick=()=>speak(prospects);document.getElementById('talk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Voice recognition is not supported in this browser.';return}const r=new SR();r.lang='en-US';r.onstart=()=>status.textContent='Listening…';r.onresult=e=>{const q=e.results[0][0].transcript.toLowerCase();status.textContent='You said: '+q;if(q.includes('greet')&&q.includes('prospect'))speak(prospects);else if(q.includes('greet'))speak(brothers);else speak('I heard you. This is the RDMC Sol preview. Full assistant conversation is the next integration step.')};r.onerror=()=>status.textContent='I could not hear that. Try again.';r.start()};</script></body></html>
