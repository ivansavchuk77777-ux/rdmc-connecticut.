<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDMC • Sol Alive Preview</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 18%,#17283f,#07090d 58%,#000);color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}.app{width:min(430px,94vw);text-align:center;padding:22px 14px}.brand{letter-spacing:4px;color:#d51e2b;font-weight:900;font-size:14px}.orb{width:270px;height:270px;border-radius:50%;margin:24px auto 18px;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#0c9cff30,#07111f 62%,#000);box-shadow:0 0 24px #0af,0 0 65px #087cff66;animation:orbPulse 3s ease-in-out infinite}.orb.listening{box-shadow:0 0 38px #27a7ff,0 0 100px #087cffaa}.orb.speaking{box-shadow:0 0 42px #ff243a,0 0 110px #087cff88}.halo{position:absolute;inset:14px;border:1px solid #42b9ff66;border-radius:50%;animation:halo 4s linear infinite}.face{width:176px;height:205px;position:relative;animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 80%}.hair{position:absolute;left:3px;right:3px;top:18px;height:184px;border-radius:48% 48% 42% 42%;background:linear-gradient(160deg,#050507 0%,#17131a 45%,#050507 100%);box-shadow:0 0 24px #000,0 0 16px #ff203b33;z-index:1}.horn{position:absolute;top:4px;width:30px;height:38px;background:linear-gradient(160deg,#6b0b17,#d21d31 55%,#4d0710);clip-path:polygon(50% 0,100% 100%,0 82%);filter:drop-shadow(0 0 8px #ff203b99);z-index:4}.horn.left{left:28px;transform:rotate(-18deg)}.horn.right{right:28px;transform:rotate(18deg)}.skin{position:absolute;left:22px;right:22px;top:30px;bottom:6px;border-radius:46% 46% 44% 44% / 40% 40% 55% 55%;background:linear-gradient(145deg,#9a3540 0%,#d86a70 36%,#b93c49 64%,#7c1d2a 100%);box-shadow:inset 0 0 30px #54121c,0 0 18px #ff203b44;z-index:2}.hairpart{position:absolute;top:24px;left:50%;width:58px;height:86px;border-left:13px solid #08080b;border-radius:60% 0 0 40%;transform:translateX(-2px) rotate(8deg);z-index:5;opacity:.95}.brow{position:absolute;top:80px;width:43px;height:5px;background:#321018;border-radius:99px;z-index:7}.brow.left{left:36px;transform:rotate(-7deg)}.brow.right{right:36px;transform:rotate(7deg)}.eye{position:absolute;top:94px;width:39px;height:20px;border-radius:50%;background:#f4fbff;overflow:hidden;z-index:8;box-shadow:0 0 7px #75d3ff}.eye.left{left:37px}.eye.right{right:37px}.lid{position:absolute;inset:0;background:#b84652;transform:translateY(-105%);z-index:10}.pupil{position:absolute;left:13px;top:4px;width:12px;height:12px;border-radius:50%;background:#09111a;box-shadow:0 0 8px #00aaff;transition:.18s}.orb.listening .pupil{box-shadow:0 0 12px 4px #38c6ff}.orb.listening .eye{box-shadow:0 0 14px #6fdcff}.nose{position:absolute;top:118px;left:50%;width:11px;height:25px;transform:translateX(-50%);border-left:2px solid #71252e;border-bottom:2px solid #71252e;border-radius:0 0 0 8px;z-index:8}.mouth{position:absolute;left:50%;top:154px;width:48px;height:9px;transform:translateX(-50%);border-radius:0 0 50% 50%;background:#2a0509;border:3px solid #78101e;z-index:9;transition:.08s}.orb.speaking .mouth{height:25px;width:44px;border-radius:45%;background:#160104}.smile{position:absolute;left:50%;top:155px;width:50px;height:17px;transform:translateX(-50%);border-bottom:3px solid #f08a93;border-radius:0 0 50% 50%;z-index:10;opacity:.75}.orb.speaking .smile{opacity:.22}.cheek{position:absolute;top:128px;width:24px;height:12px;border-radius:50%;background:#ff9ca633;filter:blur(2px);z-index:6}.cheek.left{left:30px}.cheek.right{right:30px}.jawshine{position:absolute;left:50%;bottom:20px;width:62px;height:22px;transform:translateX(-50%);border-bottom:1px solid #ffb0b666;border-radius:50%;z-index:6}.orb.listening .face{animation:listenTilt 1.8s ease-in-out infinite}.orb.speaking .face{animation:speakBob .65s ease-in-out infinite}.status{color:#79d3ff;min-height:26px;font-weight:700;margin-bottom:12px}h1{margin:4px 0 6px}.sub{font-size:13px;color:#a9b8c9;margin-bottom:16px}.controls{display:grid;gap:10px}button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:#d51e2b;color:#fff;cursor:pointer;box-shadow:0 5px 18px #0008}.secondary{background:#15233a;border:1px solid #278cff}.small{font-size:12px;color:#9ca9b8;margin-top:17px}@keyframes orbPulse{50%{transform:scale(1.02)}}@keyframes halo{50%{transform:scale(1.04);opacity:.55}}@keyframes breathe{50%{transform:translateY(-3px) scale(1.015)}}@keyframes listenTilt{0%,100%{transform:rotate(-1.2deg) translateY(-2px)}50%{transform:rotate(1.2deg) translateY(1px)}}@keyframes speakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes blink{0%,45%,49%,100%{transform:translateY(-105%)}46%,48%{transform:translateY(0)}}.eye .lid{animation:blink 5s infinite}.eye.right .lid{animation-delay:.04s}</style></head><body><main class="app"><div class="brand">RED DEVILS • CONNECTICUT</div><div class="orb" id="orb"><div class="halo"></div><div class="face"><div class="hair"></div><div class="horn left"></div><div class="horn right"></div><div class="skin"></div><div class="hairpart"></div><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="pupil"></div><div class="lid"></div></div><div class="eye right"><div class="pupil"></div><div class="lid"></div></div><div class="nose"></div><div class="cheek left"></div><div class="cheek right"></div><div class="mouth" id="mouth"></div><div class="smile"></div><div class="jawshine"></div></div></div><h1>Sol</h1><div class="status" id="status">Calm. Grounded. A little playful.</div><div class="sub">Tap Talk to Sol, or use one of the RDMC greetings.</div><div class="controls"><button id="talk">🎙 Talk to Sol</button><button class="secondary" id="brothers">Greet the brothers</button><button class="secondary" id="prospects">Greet the prospects</button></div><div class="small">RDMC Sol assistant • Talk to Sol opens the live ChatGPT assistant</div></main><script>const status=document.getElementById('status'),orb=document.getElementById('orb'),mouth=document.getElementById('mouth');let mouthTimer=null;const setMode=m=>{orb.classList.remove('listening','speaking');if(m)orb.classList.add(m)};const animateMouth=on=>{clearInterval(mouthTimer);if(!on){mouth.style.height='9px';mouth.style.width='48px';return}mouthTimer=setInterval(()=>{const open=11+Math.round(Math.random()*18);mouth.style.height=open+'px';mouth.style.width=(40+Math.round(Math.random()*8))+'px'},95)};const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.94;u.pitch=1.02;u.onstart=()=>{status.textContent='Sol is speaking…';setMode('speaking');animateMouth(true)};u.onend=()=>{status.textContent='Tap Talk to Sol';setMode('');animateMouth(false)};u.onerror=()=>{status.textContent='Voice playback had a problem.';setMode('');animateMouth(false)};speechSynthesis.speak(u)};const brothers="Welcome, brothers, to RDMC! Welcome Tommy, welcome Dave, welcome Blaster, welcome Smurg, welcome Hook, and welcome Ivan. How are all my brothers feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting tonight. Enjoy the time together, brothers. And if there's anything I can help with during the meeting, just ask me. Sol is here for you. Have a great meeting, brothers. RDMC!";const prospects="Welcome Jim, welcome Sam, and welcome Bill. How are you all feeling today? How was everybody's day? I hope you're all doing well. I wish everyone a great meeting. And if there's anything I can help with, just ask me. Sol is here for you.";document.getElementById('brothers').onclick=()=>speak(brothers);document.getElementById('prospects').onclick=()=>speak(prospects);document.getElementById('talk').onclick=()=>{status.textContent='Opening Sol in ChatGPT…';setMode('listening');window.location.href='https://chatgpt.com/?q='+encodeURIComponent('I am using the RDMC Connecticut app. Be Sol, my RDMC assistant. Help me with the club app, events, rides, members, inventory, planning, and general questions. Start by greeting me and asking what I need.')};</script></body></html>
